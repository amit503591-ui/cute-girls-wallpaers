<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e2e8f0" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle circular backdrop -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />
  
  <!-- Stylized Phone Wallpaper Mockup Frame -->
  <rect x="156" y="96" width="200" height="320" rx="36" fill="url(#phoneGrad)" filter="url(#glow)" />
  <rect x="166" y="106" width="180" height="300" rx="28" fill="url(#screenGrad)" />
  
  <!-- Camera notch -->
  <circle cx="256" cy="120" r="5" fill="#0f172a" />
  
  <!-- Wallpaper landscape / sun inside screen -->
  <circle cx="210" cy="210" r="32" fill="#fbbf24" opacity="0.9" />
  <path d="M166 350 L220 280 L260 320 L310 250 L346 320 L346 406 L166 406 Z" fill="#ec4899" opacity="0.75" />
  <path d="M166 380 L250 310 L300 360 L346 320 L346 406 L166 406 Z" fill="#3b82f6" opacity="0.7" />
  
  <!-- Sparkling stars -->
  <path d="M370 120 L376 136 L392 142 L376 148 L370 164 L364 148 L348 142 L364 136 Z" fill="#ffffff" opacity="0.9" />
  <path d="M120 340 L124 352 L136 356 L124 360 L120 372 L116 360 L104 356 L116 352 Z" fill="#ffffff" opacity="0.8" />
  <path d="M380 340 L383 350 L393 353 L383 356 L380 366 L377 356 L367 353 L377 350 Z" fill="#ffffff" opacity="0.8" />
</svg>
